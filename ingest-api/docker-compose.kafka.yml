version: "3.8"

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - kafka-net

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080" # UI at http://localhost:8080
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    networks:
      - kafka-net

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081" # still keep host port for manual debugging if you like
    environment:
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      # Use internal Kafka listener (same as other containers)
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "1"
      SCHEMA_REGISTRY_HTTP2_ENABLED: "false"
    networks:
      - kafka-net

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coldstore
      POSTGRES_USER: coldstore
      POSTGRES_PASSWORD: coldstore
    ports:
      - "5432:5432" # optional; keep if you want to inspect DB from host
    volumes:
      - ../detector-service/db/schema_v2.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../detector-service/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - kafka-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@example.com" # login email
      PGADMIN_DEFAULT_PASSWORD: "admin123" # login password
      PGADMIN_CONFIG_SERVER_MODE: "False" # single-user desktop-style mode
    ports:
      - "5050:80" # pgAdmin at http://localhost:5050
    volumes:
      # optional but nice: persist pgAdmin config (saved connections etc.)
      - ./pgadmin-data:/var/lib/pgadmin
    networks:
      - kafka-net

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - kafka-net

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8082:8081" # Mongo Express UI at http://localhost:8082
    networks:
      - kafka-net
    depends_on:
      mongo:
        condition: service_started

  ingest-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingest-api
    depends_on:
      kafka:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8088
      QUEUE_BACKEND: kafka
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_CLIENT_ID: ingest-api
      KAFKA_TOPIC_EVENTS: events.ingest.v1
    ports:
      - "8088:8088"
    networks:
      - kafka-net

  detector:
    build:
      context: ../detector-service
      dockerfile: Dockerfile
    container_name: detector
    depends_on:
      kafka:
        condition: service_started
      schema-registry:
        condition: service_started
      postgres:
        condition: service_started
      # - kafka
      # - schema-registry
      # - postgres
    environment:
      # Service basics
      SERVICE_NAME: detector
      NODE_ENV: production
      PORT: 4001

      # Postgres: use container name as host
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: coldstore
      PG_USER: coldstore
      PG_PASSWORD: coldstore
      PG_SSL: "false"

      # Kafka & topics: use internal broker address
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_CLIENT_ID: detector
      KAFKA_GROUP_ID: coldstore-detector-v1
      INGEST_TOPIC: events.ingest.v1
      DETECTED_TOPIC: events.detected.v1
      DLQ_TOPIC: events.ingest.dlq.v1

      # Schema Registry: talk to container directly, not via host ports
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"

      # Optional logging
      LOG_LEVEL: info

      # Detected event payload encoding
      DETECTED_ENCODING: json
    ports:
      - "4001:4001" # expose /health and /metrics to host
    networks:
      - kafka-net

  indexer:
    build:
      context: ../indexer-service
      dockerfile: Dockerfile
    container_name: indexer
    restart: unless-stopped
    environment:
      SERVICE_NAME: indexer
      NODE_ENV: production
      PORT: 4002

      KAFKA_BROKERS: "kafka:29092"
      KAFKA_CLIENT_ID: indexer
      KAFKA_GROUP_ID: coldstore-indexer-v1
      DETECTED_TOPIC: events.detected.v1
      INDEXER_DLQ_TOPIC: events.detected.dlq.v1

      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"

      ES_NODE_URL: "http://elasticsearch:9200"
      ES_INDEX: "coldstore-detected-events"

      LOG_LEVEL: "info"
    ports:
      - "4002:4002" # expose /health and /metrics
    networks:
      - kafka-net
    depends_on:
      kafka:
        condition: service_started
      schema-registry:
        condition: service_started
      elasticsearch:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      # Single-node dev mode
      - discovery.type=single-node

      # Disable security for local dev (no HTTPS, no credentials)
      - xpack.security.enabled=false

      # Keep heap small for Docker Desktop
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      # Expose ES HTTP API on localhost:9200
      - "9200:9200"

    volumes:
      # Persist ES data locally so index survives restarts
      - es-data:/usr/share/elasticsearch/data

    networks:
      - kafka-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    hostname: kibana
    restart: unless-stopped
    environment:
      # Point Kibana at our ES container
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      # Disable auth for local dev (since ES has security disabled)
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601" # Kibana UI on http://localhost:5601
    depends_on:
      - elasticsearch
    networks:
      - kafka-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - observability

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - ./observability/loki/data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    volumes:
      - ../logs:/mnt/logs:ro
      - ../observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    ports:
      - "9080:9080"
    networks:
      - observability
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    networks:
      - observability
    depends_on:
      - prometheus
      - loki

  genai:
    build:
      context: ../genai-service
      dockerfile: Dockerfile
    container_name: genai
    restart: unless-stopped
    environment:
      SERVICE_NAME: genai
      NODE_ENV: production
      PORT: 4100

      # Postgres (detector DB)
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: coldstore
      PG_USER: coldstore
      PG_PASSWORD: coldstore

      # Elasticsearch
      ES_URL: http://elasticsearch:9200
      ES_INDEX: coldstore-detected-events

      # LLM
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4.1-mini
    ports:
      - "4100:4100" # expose GenAI API on localhost:4100
    networks:
      - kafka-net
    depends_on:
      postgres:
        condition: service_started
      elasticsearch:
        condition: service_started

  notification:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: notification
    restart: unless-stopped
    environment:
      SERVICE_NAME: notification
      NODE_ENV: production
      PORT: 4003

      KAFKA_BROKERS: "kafka:29092"
      KAFKA_CLIENT_ID: notification
      KAFKA_GROUP_ID: coldstore-notification-v1
      DETECTED_TOPIC: events.detected.v1
      NOTIFICATIONS_TOPIC: events.notifications.v1

      MONGO_URL: mongodb://mongo:27017/coldstore_notifications
      NOTIFICATION_DEFAULT_WINDOW_SECONDS: 300

      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_TO_EMAILS: ${SENDGRID_TO_EMAILS:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_SMS_TO: ${TWILIO_SMS_TO:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_WHATSAPP_TO: ${TWILIO_WHATSAPP_TO:-}
    ports:
      - "4003:4003"
    networks:
      - kafka-net
    depends_on:
      kafka:
        condition: service_started
      mongo:
        condition: service_started

  dashboard-api:
    build:
      context: ../dashboard-api
      dockerfile: Dockerfile
    container_name: dashboard-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4200

      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: coldstore
      PG_USER: coldstore
      PG_PASSWORD: coldstore

      ES_URL: http://elasticsearch:9200
      ES_INDEX: coldstore-detected-events

      GENAI_URL: http://genai:4100
      NOTIFICATION_URL: http://notification:4003
      NOTIFICATION_TIMEOUT_MS: 10000

      API_TOKEN: dev-token
      DEFAULT_TENANT_KEY: potato_wh
      DEFAULT_TIME_WINDOW_MINUTES: 120
      WS_PUSH_INTERVAL_MS: 5000
    ports:
      - "4200:4200"
    networks:
      - kafka-net
    depends_on:
      postgres:
        condition: service_started
      elasticsearch:
        condition: service_started
      genai:
        condition: service_started

  dashboard-ui:
    build:
      context: ../dashboard-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4200/api
        VITE_WS_URL: ws://localhost:4200/ws
        VITE_API_TOKEN: dev-token
        VITE_DEFAULT_TENANT_KEY: potato_wh
    container_name: dashboard-ui
    restart: unless-stopped
    ports:
      - "4300:4300"
    networks:
      - kafka-net
    depends_on:
      dashboard-api:
        condition: service_started

networks:
  kafka-net:
    name: kafka-net
  observability:
    driver: bridge

volumes:
  es-data:
  mongo-data:
