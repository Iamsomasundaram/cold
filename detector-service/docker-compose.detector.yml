version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coldstore
      POSTGRES_USER: coldstore
      POSTGRES_PASSWORD: coldstore
    ports:
      - "5432:5432"
    volumes:
      # Runs once on first container start and creates schema + seed data
      - ./db/schema_v2.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

