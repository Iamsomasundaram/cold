server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ingest-api-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: ingest-api
          app: ingest-api
          __path__: /mnt/logs/ingest-api.log
