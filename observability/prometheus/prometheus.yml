global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape your ingest-api metrics endpoint
  - job_name: "ingest-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          # Docker Desktop: host.docker.internal points to your Windows host
          - "host.docker.internal:8080"
        labels:
          app: "ingest-api"
